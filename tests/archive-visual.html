<!doctype html>
<meta charset="utf-8">
<title>Arkivdesign – visuell kontroll</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style>
<iframe id="preview" src="../tester.html"></iframe>
<script>
preview.onload=()=>preview.contentWindow.eval(`
  $('quickStartBtn').click();
  current=TimelineLearning.drawCard(events.find(card=>card.bankId==='SPECIAL-NILS'));
  showCurrent(current);
  placed=['G22','U4','U6','SPECIAL-NILS'].map(id=>{
    const card=events.find(event=>event.bankId===id);
    return {...card,variant:card.fixedVariant||'normal'};
  });
  renderTimeline();
  document.querySelector('.play-top').scrollIntoView();
`);
</script>
